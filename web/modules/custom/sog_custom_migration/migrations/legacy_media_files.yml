id: legacy_media_files
label: Media files from legacy D7 site.
migration_tags:
  - media
migration_group: legacy_content
source:
  plugin: d7_file
destination:
  plugin: 'entity:media'
  default_bundle: image
process:
  field_media_image/target_id:
    plugin: migration_lookup
    migration_lookup: legacy_files
    source: fid
  created: timestamp
  changed: timestamp
  # Able to skip content based on type.
  # temp:
  #   plugin: skip_on_value
  #   methood: row
  #   source: filemime
  #   type: 'application/pdf'
migation_dependencies:
  required:
    - legacy_files